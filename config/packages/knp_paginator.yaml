knp_paginator:
    page_range: 5                       # Le nombre de pages affichées dans le menu de navigation
    default_options:
        page_name: page                 # Le nom du paramètre dans l'URL (ex: ?page=2)
        sort_field_name: sort           # Nom du paramètre de tri
        sort_direction_name: direction  # Nom du paramètre de direction du tri
        distinct: true                  # Garantit des résultats uniques
        filter_field_name: filterField
        filter_value_name: filterValue
    template:
        # Configuration du design de la pagination (Bootstrap 5 par défaut)
        pagination: '@KnpPaginator/Pagination/bootstrap_v5_pagination.html.twig'
        sortable: '@KnpPaginator/Pagination/sortable_link.html.twig'
        filtration: '@KnpPaginator/Pagination/filtration.html.twig'